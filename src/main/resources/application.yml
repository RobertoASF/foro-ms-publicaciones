server:
  port: 8082

spring:
  application:
    name: ms-publicaciones
  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    cl.duoc.foro: ${LOG_NIVEL:INFO}

jwt:
  secreto: ${JWT_SECRETO}

cors:
  origen: ${CORS_ORIGEN:http://localhost:3000}
