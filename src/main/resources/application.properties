spring.application.name=ms-publicaciones

logging.level.root=INFO
logging.level.org.hibernate=DEBUG
logging.level.org.springframework=DEBUG
logging.level.cl.duoc.foro=${LOG_NIVEL:INFO}

spring.datasource.url=jdbc:oracle:thin:@dbfullstack3_tp?TNS_ADMIN=/Wallet_dbfullstack3
spring.datasource.username=foro_publicaciones
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

server.port=8082

management.endpoints.web.exposure.include=health,info

jwt.secreto=${JWT_SECRETO}

cors.origen=${CORS_ORIGEN:http://localhost:3000}
